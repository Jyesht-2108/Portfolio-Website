<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Me</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2Pkf6r1KqvM9uZ3rroWAtxEvsC0BpFkOuk+qS0b+Y2Z7rGJ7Sk6bOZxw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <nav class="site-nav" aria-label="Primary">
        <a href="index.html" data-nav="home">Home</a>
        <a href="assets/Resume.pdf" target="_blank" rel="noopener" data-nav="resume">Resume</a>
        <a href="contact.html" data-nav="contact">Contact</a>
      </nav>
      <h1>Contact Me</h1>
      <p class="subtitle">I'd love to hear from you. Send a message below.</p>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container reveal">
        <form id="contact-form" class="form" novalidate>
          <div class="row two">
            <div>
              <label for="name">Name</label>
              <input type="text" id="name" name="name" placeholder="Your full name" required>
              <div class="error" data-error-for="name"></div>
            </div>
            <div>
              <label for="email">Email</label>
              <input type="email" id="email" name="email" placeholder="you@example.com" required>
              <div class="error" data-error-for="email"></div>
            </div>
          </div>
          <div>
            <label for="subject">Subject</label>
            <input type="text" id="subject" name="subject" placeholder="What is this about?" required>
            <div class="error" data-error-for="subject"></div>
          </div>
          <div>
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="6" placeholder="Write your message..." required></textarea>
            <div class="error" data-error-for="message"></div>
          </div>
          <div class="actions">
            <button type="submit" class="btn primary">Send Message</button>
            <button type="reset" class="btn">Reset</button>
          </div>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; <span id="year"></span> <span id="footer-name"></span></p>
    </div>
  </footer>

  <script>
    document.documentElement.setAttribute('data-page', 'contact');
  </script>
  <script src="./script.js"></script>
</body>
</html>
