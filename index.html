<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jyesht M — Portfolio</title>
  <meta name="description" content="Portfolio of Jyesht M — web/mobile development and DevOps (Linux, Docker)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2Pkf6r1KqvM9uZ3rroWAtxEvsC0BpFkOuk+qS0b+Y2Z7rGJ7Sk6bOZxw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <nav class="site-nav" aria-label="Primary">
        <a href="index.html" data-nav="home">Home</a>
        <a href="assets/Resume.pdf" target="_blank" rel="noopener" data-nav="resume">Resume</a>
        <a href="contact.html" data-nav="contact">Contact</a>
      </nav>
      <div class="hero">
        <div class="intro">
          <h1 id="site-title"></h1>
          <p id="site-subtitle" class="subtitle"></p>
          <div id="social-links" class="social-links"></div>
        </div>
        <figure class="photo" aria-label="Professional photo">
          <picture>
            <source srcset="assets/profile.jpeg">
            <img src="https://raw.githubusercontent.com/Jyesht-2108/Resume/main/profile.jpeg" alt="Professional headshot of Jyesht M" loading="eager">
          </picture>
        </figure>
      </div>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container reveal">
        <h2>Skills</h2>
        <div id="skills" class="cards"></div>
      </div>
    </section>

    <section class="section alt">
      <div class="container reveal">
        <h2>Experience</h2>
        <div id="experience" class="timeline"></div>
      </div>
    </section>

    <section class="section">
      <div class="container reveal">
        <h2>Projects</h2>
        <p id="projects-description" class="muted"></p>
      </div>
    </section>

    <section class="section alt">
      <div class="container reveal">
        <h2>Contact</h2>
        <div id="contact" class="contact"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; <span id="year"></span> <span id="footer-name"></span></p>
    </div>
  </footer>

  <script>
    document.documentElement.setAttribute('data-page', 'home');
  </script>
  <script src="./script.js"></script>
</body>
</html>
